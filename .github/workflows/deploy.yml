name: Deploy MkDocs

on:
  push:
    paths:
      - 'Codes/**'  # Trigger only when something in Codes/ changes
      - '.github/workflows/deploy.yml'  # Optional: run if this workflow is updated
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
          
      - name: Install dependencies
        run: |
          pip install -r req.txt

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force

      - run: cp Codes/* docs/ # copy all notebooks to docs folder
